name: Orders Consumer Release

run-name: Orders consumer release ${{ github.sha }} to production

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: orders-service-production
  cancel-in-progress: false

jobs:
  build-and-publish-consumer:
    runs-on: ubuntu-latest
    environment:
      name: production
    outputs:
      application_version: ${{ steps.release.outputs.application_version }}
      service_image: ${{ steps.release.outputs.service_image }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - id: release
        name: Define immutable release artefact
        shell: bash
        run: |
          version="$GITHUB_SHA"
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/orders-service:$version"
          echo "application_version=$version" >> "$GITHUB_OUTPUT"
          echo "service_image=$image" >> "$GITHUB_OUTPUT"
      - name: Build orders-service version
        run: mvn -B -pl services/orders-service -am package -DskipTests
      - name: Run orders-service consumer Pact tests
        run: >-
          mvn -B -pl quality-engineering-tests -am
          -Dsurefire.failIfNoSpecifiedTests=false
          -Dtest=InventoryConsumerPactTest
          test
      - name: Install Pact Broker CLI
        uses: pact-foundation/pact-broker-cli@v0.8.6
      - name: Verify Pact Broker configuration
        env:
          PACT_BROKER_BASE_URL: ${{ secrets.PACT_BROKER_BASE_URL }}
          PACT_BROKER_TOKEN: ${{ secrets.PACT_BROKER_TOKEN }}
        run: |
          [[ -n "$PACT_BROKER_BASE_URL" && -n "$PACT_BROKER_TOKEN" ]] || {
            echo "::error title=Pact Broker configuration missing::Configure PACT_BROKER_BASE_URL and PACT_BROKER_TOKEN in the production environment."
            exit 2
          }
      - name: Publish orders-service consumer Pact
        env:
          PACT_BROKER_BASE_URL: ${{ secrets.PACT_BROKER_BASE_URL }}
          PACT_BROKER_TOKEN: ${{ secrets.PACT_BROKER_TOKEN }}
        run: >-
          pact-broker-cli publish
          --consumer-app-version "${{ steps.release.outputs.application_version }}"
          --branch "$GITHUB_REF_NAME"
          quality-engineering-tests/target/pacts/orders-service-inventory-service.json
      - name: Sign in to GitHub Container Registry
        run: echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Build and push immutable orders-service image
        run: >-
          docker build
          --file services/orders-service/Dockerfile
          --tag "${{ steps.release.outputs.service_image }}"
          .
      - name: Push orders-service image
        run: docker push "${{ steps.release.outputs.service_image }}"

  can-i-deploy:
    needs: build-and-publish-consumer
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - uses: actions/checkout@v7
      - uses: pact-foundation/pact-broker-cli@v0.8.6
      - name: Wait for inventory-service verification and check compatibility
        env:
          PACT_BROKER_BASE_URL: ${{ secrets.PACT_BROKER_BASE_URL }}
          PACT_BROKER_TOKEN: ${{ secrets.PACT_BROKER_TOKEN }}
          PACTICIPANT: orders-service
          APPLICATION_VERSION: ${{ needs.build-and-publish-consumer.outputs.application_version }}
          TARGET_ENVIRONMENT: production
          PACT_RETRY_COUNT: '30'
          PACT_RETRY_INTERVAL: '10'
        run: ./scripts/can-i-deploy.sh

  deploy-and-record:
    needs: [build-and-publish-consumer, can-i-deploy]
    runs-on: ubuntu-latest
    environment:
      name: production
    env:
      KUBE_CONFIG_DATA: ${{ secrets.KUBE_CONFIG_DATA }}
      K8S_NAMESPACE: ${{ vars.K8S_NAMESPACE || 'default' }}
      ORDERS_BASE_URL: ${{ vars.ORDERS_BASE_URL }}
      PACT_BROKER_BASE_URL: ${{ secrets.PACT_BROKER_BASE_URL }}
      PACT_BROKER_TOKEN: ${{ secrets.PACT_BROKER_TOKEN }}
      PACTICIPANT: orders-service
      APPLICATION_VERSION: ${{ needs.build-and-publish-consumer.outputs.application_version }}
      TARGET_ENVIRONMENT: production
    steps:
      - uses: actions/checkout@v7
      - name: Configure Kubernetes access
        run: ./scripts/configure-kubeconfig.sh
      - name: Deploy orders-service image and wait for rollout
        env:
          K8S_MANIFEST: k8s/orders.yaml
          SERVICE_NAME: orders-service
          SERVICE_IMAGE: ${{ needs.build-and-publish-consumer.outputs.service_image }}
        run: ./scripts/deploy-kubernetes-service.sh
      - name: Verify health and metrics
        env:
          SERVICE_BASE_URL: ${{ vars.ORDERS_BASE_URL }}
        run: ./scripts/verify-http-service.sh
      - name: Verify critical order operation
        run: ./scripts/verify-orders-operation.sh
      - name: Install Pact Broker CLI
        uses: pact-foundation/pact-broker-cli@v0.8.6
      - name: Record actual orders-service deployment
        run: ./scripts/record-pact-deployment.sh
