name: Inventory Provider Release

run-name: Inventory provider release ${{ github.sha }} to production

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: inventory-service-production
  cancel-in-progress: false

jobs:
  build-and-verify-provider:
    runs-on: ubuntu-latest
    environment:
      name: production
    outputs:
      application_version: ${{ steps.release.outputs.application_version }}
      service_image: ${{ steps.release.outputs.service_image }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - id: release
        name: Define immutable release artefact
        shell: bash
        run: |
          version="$GITHUB_SHA"
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/inventory-service:$version"
          echo "application_version=$version" >> "$GITHUB_OUTPUT"
          echo "service_image=$image" >> "$GITHUB_OUTPUT"
      - name: Build inventory-service version
        run: mvn -B -pl services/inventory-service -am package -DskipTests
      - name: Verify Pact Broker configuration
        env:
          PACT_BROKER_BASE_URL: ${{ secrets.PACT_BROKER_BASE_URL }}
          PACT_BROKER_TOKEN: ${{ secrets.PACT_BROKER_TOKEN }}
        run: |
          [[ -n "$PACT_BROKER_BASE_URL" && -n "$PACT_BROKER_TOKEN" ]] || {
            echo "::error title=Pact Broker configuration missing::Configure PACT_BROKER_BASE_URL and PACT_BROKER_TOKEN in the production environment."
            exit 2
          }
      - name: Verify and publish provider Pact results
        env:
          PACT_BROKER_BASE_URL: ${{ secrets.PACT_BROKER_BASE_URL }}
          PACT_BROKER_TOKEN: ${{ secrets.PACT_BROKER_TOKEN }}
        run: >-
          mvn -B -pl quality-engineering-tests -am
          -Dsurefire.failIfNoSpecifiedTests=false
          -Dtest=InventoryBrokerPactVerification
          -Dpactbroker.url="$PACT_BROKER_BASE_URL"
          -Dpactbroker.auth.token="$PACT_BROKER_TOKEN"
          -Dpact.provider.version="${{ steps.release.outputs.application_version }}"
          -Dpact.provider.branch="$GITHUB_REF_NAME"
          -Dpact.verifier.publishResults=true
          test
      - name: Sign in to GitHub Container Registry
        run: echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Build and push immutable inventory-service image
        run: >-
          docker build
          --file services/inventory-service/Dockerfile
          --tag "${{ steps.release.outputs.service_image }}"
          .
      - name: Push inventory-service image
        run: docker push "${{ steps.release.outputs.service_image }}"

  can-i-deploy:
    needs: build-and-verify-provider
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - uses: actions/checkout@v7
      - uses: pact-foundation/pact-broker-cli@v0.8.6
      - name: Check inventory-service deployment compatibility
        env:
          PACT_BROKER_BASE_URL: ${{ secrets.PACT_BROKER_BASE_URL }}
          PACT_BROKER_TOKEN: ${{ secrets.PACT_BROKER_TOKEN }}
          PACTICIPANT: inventory-service
          APPLICATION_VERSION: ${{ needs.build-and-verify-provider.outputs.application_version }}
          TARGET_ENVIRONMENT: production
        run: ./scripts/can-i-deploy.sh

  deploy-and-record:
    needs: [build-and-verify-provider, can-i-deploy]
    runs-on: ubuntu-latest
    environment:
      name: production
    env:
      KUBE_CONFIG_DATA: ${{ secrets.KUBE_CONFIG_DATA }}
      K8S_NAMESPACE: ${{ vars.K8S_NAMESPACE || 'default' }}
      INVENTORY_BASE_URL: ${{ vars.INVENTORY_BASE_URL }}
      PACT_BROKER_BASE_URL: ${{ secrets.PACT_BROKER_BASE_URL }}
      PACT_BROKER_TOKEN: ${{ secrets.PACT_BROKER_TOKEN }}
      PACTICIPANT: inventory-service
      APPLICATION_VERSION: ${{ needs.build-and-verify-provider.outputs.application_version }}
      TARGET_ENVIRONMENT: production
    steps:
      - uses: actions/checkout@v7
      - name: Configure Kubernetes access
        run: ./scripts/configure-kubeconfig.sh
      - name: Deploy inventory-service image and wait for rollout
        env:
          K8S_MANIFEST: k8s/inventory.yaml
          SERVICE_NAME: inventory-service
          SERVICE_IMAGE: ${{ needs.build-and-verify-provider.outputs.service_image }}
        run: ./scripts/deploy-kubernetes-service.sh
      - name: Verify health and metrics
        env:
          SERVICE_BASE_URL: ${{ vars.INVENTORY_BASE_URL }}
        run: ./scripts/verify-http-service.sh
      - name: Install Pact Broker CLI
        uses: pact-foundation/pact-broker-cli@v0.8.6
      - name: Record actual inventory-service deployment
        run: ./scripts/record-pact-deployment.sh
