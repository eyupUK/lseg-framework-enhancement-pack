name: LSEG Quality Gates

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  java-fast-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Unit, resilience and AWS-emulation tests
        run: mvn -B -pl quality-engineering-tests -am test
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: java-test-reports
          path: '**/target/surefire-reports/**'

  publish-pact-contracts:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: java-fast-tests
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - uses: actions/checkout@v7
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Generate orders-service to inventory-service Pact
        run: >-
          mvn -B -pl quality-engineering-tests -am
          -Dsurefire.failIfNoSpecifiedTests=false
          -Dtest=InventoryConsumerPactTest
          test
      - name: Generate order-dashboard to orders-service Pact
        run: >-
          mvn -B -pl quality-engineering-tests -am
          -Dsurefire.failIfNoSpecifiedTests=false
          -Dtest=OrderDashboardConsumerPactTest
          test
      - name: Install Pact Broker CLI
        uses: pact-foundation/pact-broker-cli@v0.8.6
      - name: Verify Pact Broker publication configuration
        env:
          PACT_BROKER_BASE_URL: ${{ secrets.PACT_BROKER_BASE_URL }}
          PACT_BROKER_TOKEN: ${{ secrets.PACT_BROKER_TOKEN }}
        run: |
          missing=()
          [[ -n "$PACT_BROKER_BASE_URL" ]] || missing+=(PACT_BROKER_BASE_URL)
          [[ -n "$PACT_BROKER_TOKEN" ]] || missing+=(PACT_BROKER_TOKEN)

          if [[ "${#missing[@]}" -gt 0 ]]; then
            echo "::error title=Pact Broker configuration missing::Add ${missing[*]} as secrets to the production GitHub Environment."
            exit 2
          fi
      - name: Publish consumer Pact contracts
        env:
          PACT_BROKER_BASE_URL: ${{ secrets.PACT_BROKER_BASE_URL }}
          PACT_BROKER_TOKEN: ${{ secrets.PACT_BROKER_TOKEN }}
        run: >-
          pact-broker-cli publish
          --consumer-app-version "$GITHUB_SHA"
          --branch "$GITHUB_REF_NAME"
          quality-engineering-tests/target/pacts/*.json

  verify-inventory-provider-contracts:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: publish-pact-contracts
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Verify inventory-service Pact Broker configuration
        env:
          PACT_BROKER_BASE_URL: ${{ secrets.PACT_BROKER_BASE_URL }}
          PACT_BROKER_TOKEN: ${{ secrets.PACT_BROKER_TOKEN }}
        run: |
          missing=()
          [[ -n "$PACT_BROKER_BASE_URL" ]] || missing+=(PACT_BROKER_BASE_URL)
          [[ -n "$PACT_BROKER_TOKEN" ]] || missing+=(PACT_BROKER_TOKEN)

          if [[ "${#missing[@]}" -gt 0 ]]; then
            echo "::error title=Pact Broker configuration missing::Add ${missing[*]} as secrets to the production GitHub Environment."
            exit 2
          fi
      - name: Verify and publish inventory-service provider results
        env:
          PACT_BROKER_BASE_URL: ${{ secrets.PACT_BROKER_BASE_URL }}
          PACT_BROKER_TOKEN: ${{ secrets.PACT_BROKER_TOKEN }}
        run: >-
          mvn -B -pl quality-engineering-tests -am
          -Dsurefire.failIfNoSpecifiedTests=false
          -Dtest=InventoryBrokerPactVerification
          -Dpactbroker.url="$PACT_BROKER_BASE_URL"
          -Dpactbroker.auth.token="$PACT_BROKER_TOKEN"
          -Dpact.provider.version="$GITHUB_SHA"
          -Dpact.provider.branch="$GITHUB_REF_NAME"
          -Dpact.verifier.publishResults=true
          test

  containerised-api-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Detect parent service framework
        id: parent_framework
        shell: bash
        run: |
          required_paths=(
            services/users-service/pom.xml
            services/orders-service/pom.xml
            services-tests/users-api-tests/pom.xml
            services-tests/orders-api-tests/pom.xml
          )
          compose_files=(compose.yml compose.yaml docker-compose.yml docker-compose.yaml)
          missing_paths=()

          for path in "${required_paths[@]}"; do
            [[ -f "$path" ]] || missing_paths+=("$path")
          done

          has_compose=false
          for compose_file in "${compose_files[@]}"; do
            if [[ -f "$compose_file" ]]; then
              has_compose=true
              break
            fi
          done

          if [[ "${#missing_paths[@]}" -eq 0 && "$has_compose" == true ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Parent service checks unavailable::Running the standalone component and container integration suites instead."
          fi
      - name: Run standalone API component and LocalStack integration suites
        if: steps.parent_framework.outputs.available != 'true'
        run: >-
          mvn -B -pl quality-engineering-tests -am
          -Dsurefire.failIfNoSpecifiedTests=false
          -Dtest=OrderInventoryIntegrationTest,OrderApiComponentTest,HttpInventoryGatewayWireMockTest,LocalStackS3IntegrationTest
          test
      - name: Start standalone runnable service stack
        if: steps.parent_framework.outputs.available != 'true'
        run: docker compose up -d --build
      - name: Wait for standalone service health
        if: steps.parent_framework.outputs.available != 'true'
        run: |
          timeout 120 bash -c 'until curl -fsS http://localhost:8080/actuator/health >/dev/null; do sleep 2; done'
          timeout 120 bash -c 'until curl -fsS http://localhost:8082/actuator/health >/dev/null; do sleep 2; done'
          timeout 120 bash -c 'until curl -fsS http://localhost:8081/actuator/health >/dev/null; do sleep 2; done'
      - name: Verify standalone service observability and order operation
        if: steps.parent_framework.outputs.available != 'true'
        run: |
          mvn -B -pl quality-engineering-tests -am -Dsurefire.failIfNoSpecifiedTests=false \
            -Dtest=ObservabilitySmokeTest \
            -Dorders.baseUrl=http://localhost:8081 test
          curl --fail --show-error --silent \
            -H 'Content-Type: application/json' \
            -H 'X-Correlation-Id: ci-standalone-order' \
            --data '{"userId":1,"item":"ci-smoke","amount":1.00}' \
            http://localhost:8081/orders/new | grep -q '"id"'
      - name: Build service jars
        if: steps.parent_framework.outputs.available == 'true'
        run: mvn -B -DskipTests package -pl services/users-service,services/orders-service
      - name: Start services
        if: steps.parent_framework.outputs.available == 'true'
        run: docker compose up -d --build
      - name: Wait for health
        if: steps.parent_framework.outputs.available == 'true'
        run: |
          timeout 120 bash -c 'until curl -fsS http://localhost:8080/actuator/health >/dev/null; do sleep 2; done'
          timeout 120 bash -c 'until curl -fsS http://localhost:8081/actuator/health >/dev/null; do sleep 2; done'
      - name: Run Rest Assured API suites
        if: steps.parent_framework.outputs.available == 'true'
        run: mvn -B -Denv=dev -pl services-tests/users-api-tests,services-tests/orders-api-tests -am test
      - name: Observability smoke test
        if: steps.parent_framework.outputs.available == 'true'
        run: >-
          mvn -B -pl quality-engineering-tests -am
          -Dsurefire.failIfNoSpecifiedTests=false
          -Dtest=ObservabilitySmokeTest
          -Dorders.baseUrl=http://localhost:8081
          test
      - name: Service logs
        if: ${{ failure() && steps.parent_framework.outputs.available == 'true' }}
        run: docker compose logs
      - name: Stop services
        if: ${{ always() && steps.parent_framework.outputs.available == 'true' }}
        run: docker compose down -v
      - name: Standalone service logs
        if: ${{ failure() && steps.parent_framework.outputs.available != 'true' }}
        run: docker compose logs
      - name: Stop standalone services
        if: ${{ always() && steps.parent_framework.outputs.available != 'true' }}
        run: docker compose down -v

  python-lambda-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: lambda/order-audit/requirements-dev.txt
      - name: Install Lambda test and quality dependencies
        run: python -m pip install -r lambda/order-audit/requirements-dev.txt
      - name: Ruff quality gate
        run: ruff check lambda/order-audit
      - name: Bandit security gate
        run: bandit -q -r lambda/order-audit -x lambda/order-audit/tests
      - name: Python dependency audit
        run: pip-audit -r lambda/order-audit/requirements-dev.txt
      - name: Lambda tests
        run: pytest -q lambda/order-audit/tests

  terraform-static-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
      - working-directory: infrastructure/terraform
        run: terraform fmt -check -recursive
      - working-directory: infrastructure/terraform
        run: terraform init -backend=false
      - working-directory: infrastructure/terraform
        run: terraform validate
