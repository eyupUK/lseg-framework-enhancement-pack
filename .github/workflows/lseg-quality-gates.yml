name: LSEG Quality Gates

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  java-fast-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Unit, resilience and AWS-emulation tests
        run: mvn -B -pl quality-engineering-tests -am test
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: java-test-reports
          path: '**/target/surefire-reports/**'

  containerised-api-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Build service jars
        run: mvn -B -DskipTests package -pl services/users-service,services/orders-service
      - name: Start services
        run: docker compose up -d --build
      - name: Wait for health
        run: |
          timeout 120 bash -c 'until curl -fsS http://localhost:8080/actuator/health >/dev/null; do sleep 2; done'
          timeout 120 bash -c 'until curl -fsS http://localhost:8081/actuator/health >/dev/null; do sleep 2; done'
      - name: Run Rest Assured API suites
        run: mvn -B -Denv=dev -pl services-tests/users-api-tests,services-tests/orders-api-tests -am test
      - name: Observability smoke test
        run: mvn -B -pl quality-engineering-tests -Dtest=ObservabilitySmokeTest -Dorders.baseUrl=http://localhost:8081 test
      - name: Service logs
        if: failure()
        run: docker compose logs
      - name: Stop services
        if: always()
        run: docker compose down -v

  python-lambda-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: lambda/order-audit/requirements-dev.txt
      - run: pip install -r lambda/order-audit/requirements-dev.txt
      - run: pytest -q lambda/order-audit/tests

  terraform-static-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - working-directory: infrastructure/terraform
        run: terraform fmt -check -recursive
      - working-directory: infrastructure/terraform
        run: terraform init -backend=false
      - working-directory: infrastructure/terraform
        run: terraform validate
