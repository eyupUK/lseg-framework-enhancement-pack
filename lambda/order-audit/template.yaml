AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Order audit Lambda with least-privilege S3 access

Resources:
  AuditKey:
    Type: AWS::KMS::Key
    Properties:
      Description: Encryption key for order audit records
      EnableKeyRotation: true
      KeyPolicy:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowAccountAdministration
            Effect: Allow
            Principal:
              AWS: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:root
            Action: kms:*
            Resource: '*'

  AuditKeyAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: alias/order-audit
      TargetKeyId: !Ref AuditKey

  AuditBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              KMSMasterKeyID: !GetAtt AuditKey.Arn
              SSEAlgorithm: aws:kms
            BucketKeyEnabled: true
      VersioningConfiguration:
        Status: Enabled
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  OrderAuditFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: handler.lambda_handler
      Runtime: python3.12
      Timeout: 10
      MemorySize: 256
      Environment:
        Variables:
          AUDIT_BUCKET: !Ref AuditBucket
      Policies:
        - S3WritePolicy:
            BucketName: !Ref AuditBucket
        - Statement:
            - Effect: Allow
              Action: kms:GenerateDataKey
              Resource: !GetAtt AuditKey.Arn
      Events:
        AuditApi:
          Type: Api
          Properties:
            Path: /order-audits
            Method: post

  AuditLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${OrderAuditFunction}
      RetentionInDays: 30
